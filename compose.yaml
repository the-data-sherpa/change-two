name: change-two

x-workspace: &workspace
  image: change-two-workspace:local
  build:
    context: .
    dockerfile: docker/workspace.Dockerfile
    target: development
    args:
      NODE_IMAGE: ${NODE_IMAGE}
      PNPM_VERSION: ${PNPM_VERSION}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: change_two
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: change_two
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U change_two -d change_two"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *workspace
    command: ["pnpm", "--filter", "@change-two/starter-api", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://change_two@postgres:5432/change_two
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *workspace
    command: ["pnpm", "--filter", "@change-two/starter-api", "db:seed"]
    environment:
      DATABASE_URL: postgresql://change_two@postgres:5432/change_two
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *workspace
    command: ["pnpm", "--filter", "@change-two/starter-api", "dev"]
    environment:
      DATABASE_URL: postgresql://change_two@postgres:5432/change_two
      HOST: 0.0.0.0
      PORT: 3000
      TEST_LOGIN_ENABLED: "true"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-4173}
    ports:
      - "${API_PORT:-4300}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    <<: *workspace
    command: ["pnpm", "--filter", "@change-two/starter-web", "dev", "--host", "0.0.0.0", "--port", "4173"]
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4300}
      VITE_TEST_LOGIN_ENABLED: "true"
    ports:
      - "${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
